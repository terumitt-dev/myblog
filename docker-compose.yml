services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:create && bin/rails db:migrate && bin/rails s -b 0.0.0.0 -p 3000"
    volumes:
      - tmp:/myblog/tmp
      - .:/myblog
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password
      # Cloudflare 公開のテストキー (always pass)。
      # https://developers.cloudflare.com/turnstile/troubleshooting/testing/
      # 本物の Site Key と組み合わせて使うとフロント側で常に検証成功する。
      # 開発時にコメント投稿が動作することを優先するため直書きしている (公開値)。
      - TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA

volumes:
  tmp:
